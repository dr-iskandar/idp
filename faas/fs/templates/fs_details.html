{% extends "base.html" %} {% block styles %}
<link
  rel="stylesheet"
  href="{{ url_for('fs.static', filename='css/fs.css') }}"
/>
{% endblock %} {% block title %} Financial Statement - Details | DocIDP {%
endblock %} {% block body %}
<div class="container-fluid">
  <div class="d-flex align-items-center justify-content-between pt-3 pb-2 mb-3 border-bottom">
    <div class="d-flex align-items-center gap-3">
      <button
        type="button"
        class="btn btn-sm btn-light border rounded-pill px-3 py-1 d-inline-flex align-items-center gap-2 text-dark shadow-sm"
        onclick="location.href='/financial-statement/'"
        title="Kembali"
      >
        <i class="fa-solid fa-chevron-left text-primary"></i>
        <span class="fw-semibold">Kembali</span>
      </button>
      <h1 class="h5 mb-0 font-weight-bold text-dark">Financial Statement - Details</h1>
    </div>
  </div>
  <div class="container-fluid border p-3 bg-white">
    <div class="shadow container-fluid bg-white p-3"></div>
  </div>
  <!-- Loading Modal -->
  <div
    class="modal fade"
    id="loadingModal"
    tabindex="-1"
    aria-labelledby="loadingModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-3">Processing your request...</p>
        </div>
      </div>
    </div>
  </div>
  {% endblock %} {% block scripts %}
  <script
    defer
    src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"
  ></script>
  <script type="text/javascript">
    const statementId = "{{ statement_id }}";
  </script>
  <script
    defer
    src="{{ url_for('fs.static', filename='js/details.js') }}"
  ></script>
  {% endblock %}
</div>
