<div
  class="tab-pane fade show active"
  id="nav-basicinfo"
  role="tabpanel"
  aria-labelledby="nav-basicinfo-tab"
>
  <div class="container-fluid border border-top-0 p-3 bg-white">
    <div class="shadow container-fluid bg-white p-3">
      <div
        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center border-bottom"
      >
        <h1 class="h6">General Summary</h1>
      </div>
      <div class="table-responsive">
        <table
          id="summary-list"
          class="table table-borderless w-auto mb-0"
        ></table>
      </div>
    </div>

    <div class="shadow container-fluid bg-white p-3 mt-3">
      <div
        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center border-bottom pb-1"
      >
        <h1 class="h6">Accounts Summary</h1>
        <div
          class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center"
        >
          <select
            class="form-select"
            id="currency-select"
            aria-label="Default select example"
          >
            <option selected value="default">Choose Currency</option>
            <option value="IDR">IDR</option>
            <option value="USD">USD</option>
          </select>
        </div>
      </div>
      <div class="table-responsive">
        <table id="bs-table" class="table table-custom table-hover">
          <thead>
            <tr class="align-middle">
              <th scope="col" class="text-start">Account Number</th>
              <th scope="col">Bank Name</th>
              <th scope="col">Account Type</th>
              <th scope="col">Account Holder Name</th>
              <th scope="col">Statement Periode</th>
              <th scope="col">Currency</th>
              <!-- <th scope="col">Opening Balance</th>

              <th scope="col">Closing Balance</th> -->
              <th scope="col">Total Deposits</th>
              <th scope="col">Total Debits</th>
              <th scope="col">Total No. of Deposits</th>
              <th scope="col">Total No. of Debits</th>
            </tr>
          </thead>
          <tbody id="bs-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
